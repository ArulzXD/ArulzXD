<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Checkout Produk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f9f9f9;
    }
    .container {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button, .home-button {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      border: none;
      color: white;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover, .home-button:hover {
      background-color: #218838;
    }
    .payment-icons {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 8px;
    }
    .payment-icons img {
      height: 45px;
      background: white;
      border-radius: 8px;
      padding: 4px;
      border: 1px solid #ddd;
    }
    .order-summary {
      margin-top: 20px;
      border-top: 1px solid #ccc;
      padding-top: 10px;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
    }
    .summary-table td {
      padding: 8px 0;
    }
    .total-row td {
      border-top: 2px solid #000;
      font-weight: bold;
    }
    .jumlah-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .jumlah-wrapper button {
      width: 32px;
      padding: 6px 0;
    }
    #jumlah {
      width: 50px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Checkout Produk</h2>
    <form id="checkoutForm">
      <div class="form-group">
        <label for="produk">Produk</label>
        <input type="text" id="produk" name="produk" readonly />
      </div>
      <div class="form-group">
        <label for="harga">Harga Satuan</label>
        <input type="text" id="harga" name="harga" readonly />
      </div>
      <div class="form-group">
        <label for="jumlah">Jumlah Barang</label>
        <div class="jumlah-wrapper">
          <button type="button" onclick="ubahJumlah(-1)">-</button>
          <input type="text" id="jumlah" name="jumlah" value="1" readonly />
          <button type="button" onclick="ubahJumlah(1)">+</button>
        </div>
      </div>
      <div class="form-group">
        <label for="metode">Metode Pembayaran</label>
        <select id="metode" name="metode" required>
          <option value="">-- Pilih Metode --</option>
          <option value="DANA">DANA</option>
          <option value="OVO">OVO</option>
          <option value="GoPay">GoPay</option>
          <option value="QRIS">QRIS</option>
        </select>
        <div class="payment-icons">
          <img src="https://i.imgur.com/jyUJkaa.jpeg" alt="DANA" />
          <img src="https://i.imgur.com/eyKiIrk.jpeg" alt="OVO" />
          <img src="https://i.imgur.com/2bUZpBK.jpeg" alt="GoPay" />
          <img src="https://i.imgur.com/WXDsDdx.jpeg" alt="QRIS" style="height: 40px;" />
        </div>
      </div>
      <div class="form-group">
        <label for="nama">Nama Pembeli</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required />
      </div>
      <div class="form-group">
        <label for="wa">Nomor WhatsApp</label>
        <input type="text" id="wa" name="wa" placeholder="08xxxxxxxxxx" required />
      </div>

      <div class="order-summary">
        <table class="summary-table">
          <tr>
            <td>Subtotal</td>
            <td id="subtotal">Rp0</td>
          </tr>
          <tr>
            <td>Pajak (0.5%)</td>
            <td id="pajak">Rp0</td>
          </tr>
          <tr class="total-row">
            <td>Total</td>
            <td id="total">Rp0</td>
          </tr>
        </table>
      </div>

      <button type="submit">Kirim Pesanan via WhatsApp</button>
    </form>
    <a href="index.html"><button class="home-button">Kembali ke Beranda</button></a>
  </div>

 <script>
  const params = new URLSearchParams(window.location.search);
  const produk = params.get("produk") || "Produk Tidak Diketahui";
  const hargaProduk = parseInt(params.get("harga") || "0");

  let jumlah = 1;

  document.getElementById("produk").value = produk;
  document.getElementById("harga").value = "Rp" + hargaProduk.toLocaleString();

  function updateRingkasan() {
    const subtotal = hargaProduk * jumlah;
    const pajak = Math.round(subtotal * 0.005);
    const total = subtotal + pajak;

    document.getElementById("subtotal").textContent = "Rp" + subtotal.toLocaleString();
    document.getElementById("pajak").textContent = "Rp" + pajak.toLocaleString();
    document.getElementById("total").textContent = "Rp" + total.toLocaleString();
    return { subtotal, pajak, total };
  }

  function ubahJumlah(n) {
    jumlah = Math.max(1, jumlah + n);
    document.getElementById("jumlah").value = jumlah;
    updateRingkasan();
  }

  updateRingkasan();

  document.getElementById("checkoutForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const nama = document.getElementById("nama").value;
    const wa = document.getElementById("wa").value;
    const metode = document.getElementById("metode").value;

    const { subtotal, pajak, total } = updateRingkasan();

    let message = `*Checkout Produk*\n` +
                  `====================\n` +
                  `Produk       : ${produk}\n` +
                  `Jumlah       : ${jumlah} pcs\n` +
                  `Subtotal     : Rp${subtotal.toLocaleString()}\n` +
                  `Pajak (0.5%) : Rp${pajak.toLocaleString()}\n` +
                  `Total        : Rp${total.toLocaleString()}\n` +
                  `====================\n` +
                  `Nama         : ${nama}\n` +
                  `WhatsApp     : ${wa}\n`;

    switch (metode) {
      case "DANA":
        message += `Metode Bayar : DANA\nTransfer ke: 08xxxxxxxxxx (a.n. Admin)`;
        break;
      case "OVO":
        message += `Metode Bayar : OVO\nTransfer ke: 08xxxxxxxxxx (a.n. Admin)`;
        break;
      case "GoPay":
        message += `Metode Bayar : GoPay\nTransfer ke: 08xxxxxxxxxx (a.n. Admin)`;
        break;
      case "QRIS":
        message += `Metode Bayar : QRIS\nSilakan scan QRIS pada halaman pembayaran.`;
        break;
      default:
        message += `Metode pembayaran tidak valid.`;
    }

    const phoneNumber = "6283171080910"; // Ganti dengan nomor admin Anda
    const waURL = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;

    if (confirm("JANGAN LUPA KIRIM BUKTI PEMBAYARAN KE NOMOR ADMIN\n\nKlik OK untuk Pesan Sekarang")) {
      window.open(waURL, "_blank");
    }
  });
</script>
</body>
</html>
