<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Checkout Produk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f9f9f9;
        }
        .container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        button, .home-button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            border: none;
            color: white;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover, .home-button:hover {
            background-color: #218838;
        }

        .payment-icons {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            justify-content: center;
        }
        .payment-icons img {
            height: 40px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 4px;
            background: white;
        }

        .order-summary {
            margin-top: 20px;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
        }
        .summary-table td {
            padding: 8px 0;
        }
        .total-row td {
            border-top: 2px solid #000;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Checkout Produk</h2>
    <form id="checkoutForm">
        <div class="form-group">
            <label for="produk">Produk</label>
            <input type="text" id="produk" name="produk" readonly>
        </div>
        <div class="form-group">
            <label for="harga">Harga</label>
            <input type="text" id="harga" name="harga" readonly>
        </div>
        <div class="form-group">
            <label for="metode">Metode Pembayaran</label>
            <select id="metode" name="metode" required>
                <option value="">-- Pilih Metode --</option>
                <option value="DANA">DANA</option>
                <option value="OVO">OVO</option>
                <option value="GOPAY">GoPay</option>
                <option value="QRIS">QRIS</option>
                <option value="Transfer Bank">Transfer Bank</option>
            </select>
            <div class="payment-icons">
                <img src="https://seeklogo.com/images/D/dana-logo-1FAF7C97F6-seeklogo.com.png" alt="DANA">
                <img src="https://seeklogo.com/images/O/ovo-logo-1DC2AE244B-seeklogo.com.png" alt="OVO">
                <img src="https://seeklogo.com/images/G/gopay-logo-1C8D12C4B5-seeklogo.com.png" alt="GoPay">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/00/QRIS_logo.svg" alt="QRIS" style="height:38px;">
                <img src="https://cdn-icons-png.flaticon.com/512/483/483356.png" alt="Bank">
            </div>
        </div>
        <div class="form-group">
            <label for="nama">Nama Pembeli</label>
            <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>
        </div>
        <div class="form-group">
            <label for="wa">Nomor WhatsApp</label>
            <input type="text" id="wa" name="wa" placeholder="08xxxxxxxxxx" required>
        </div>

        <!-- Ringkasan Harga -->
        <div class="order-summary">
            <table class="summary-table">
                <tr>
                    <td>Subtotal</td>
                    <td id="subtotal">Rp0</td>
                </tr>
                <tr>
                    <td>Pajak (5%)</td>
                    <td id="pajak">Rp0</td>
                </tr>
                <tr class="total-row">
                    <td>Total</td>
                    <td id="total">Rp0</td>
                </tr>
            </table>
        </div>

        <br>
        <button type="submit">Kirim Pesanan via WhatsApp</button>
    </form>
    <a href="index.html"><button class="home-button">Kembali ke Beranda</button></a>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const produk = params.get('produk') || 'Produk Tidak Diketahui';
    const hargaProduk = parseInt(params.get('harga') || '0');
    const pajak = Math.round(hargaProduk * 0.05);
    const total = hargaProduk + pajak;

    document.getElementById('produk').value = produk;
    document.getElementById('harga').value = 'Rp' + hargaProduk.toLocaleString();
    document.getElementById('subtotal').textContent = 'Rp' + hargaProduk.toLocaleString();
    document.getElementById('pajak').textContent = 'Rp' + pajak.toLocaleString();
    document.getElementById('total').textContent = 'Rp' + total.toLocaleString();

    document.getElementById('checkoutForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const nama = document.getElementById('nama').value;
        const wa = document.getElementById('wa').value;
        const metode = document.getElementById('metode').value;

        const message = `*Checkout Pesanan*%0A------------------%0AProduk: ${produk}%0AHarga: Rp${hargaProduk.toLocaleString()}%0AMetode: ${metode}%0ANama: ${nama}%0AWA: ${wa}%0APajak (5%): Rp${pajak.toLocaleString()}%0ATotal: Rp${total.toLocaleString()}`;
        const phoneNumber = '628XXXXXXXXXX'; // Ganti dengan nomor admin
        const waURL = `https://wa.me/${phoneNumber}?text=${message}`;
        window.open(waURL, '_blank');
    });
</script>
</body>
</html>
