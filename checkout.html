<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Checkout Produk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f9f9f9;
    }
    .container {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .total {
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      border: none;
      color: white;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #218838;
    }
    .payment-icon {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .payment-icon img {
      width: 40px;
      height: auto;
    }
    .home-button {
      display: block;
      margin-bottom: 15px;
      background-color: #007bff;
    }
    .home-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
<div class="container">
  <a href="index.html">
    <button class="home-button">Beranda</button>
  </a>
  <h2>Checkout Produk</h2>
  <form id="checkoutForm">
    <div class="form-group">
      <label for="produk">Produk</label>
      <input type="text" id="produk" name="produk" readonly>
    </div>
    <div class="form-group">
      <label for="harga">Harga</label>
      <input type="text" id="harga" name="harga" readonly>
    </div>
    <div class="form-group">
      <label for="metode">Metode Pembayaran</label>
      <select id="metode" name="metode" required>
        <option value="">Pilih Metode</option>
        <option value="DANA">DANA</option>
        <option value="OVO">OVO</option>
        <option value="GOPAY">GOPAY</option>
      </select>
      <div class="payment-icon" style="margin-top:10px;">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/Logo_dana_blue.svg" alt="DANA">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Logo_ovo_purple.svg" alt="OVO">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/0a/Logo_Gopay.svg" alt="GOPAY">
      </div>
    </div>
    <div class="form-group">
      <label for="nama">Nama Pembeli</label>
      <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>
    </div>
    <div class="form-group">
      <label for="wa">Nomor WhatsApp</label>
      <input type="text" id="wa" name="wa" placeholder="08xxxxxxxxxx" required>
    </div>
    <div class="form-group total">
      <p>Subtotal: <span id="subtotal">Rp0</span></p>
      <p>Pajak (1%): <span id="pajak">Rp0</span></p>
      <p>Total: <span id="total">Rp0</span></p>
    </div>
    <button type="submit">Kirim Pesanan</button>
  </form>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const produk = params.get('produk') || 'Produk Tidak Diketahui';
  const harga = parseInt(params.get('harga')) || 0;
  const pajak = Math.round(harga * 0.01);
  const total = harga + pajak;

  document.getElementById('produk').value = produk;
  document.getElementById('harga').value = 'Rp' + harga.toLocaleString();
  document.getElementById('subtotal').innerText = 'Rp' + harga.toLocaleString();
  document.getElementById('pajak').innerText = 'Rp' + pajak.toLocaleString();
  document.getElementById('total').innerText = 'Rp' + total.toLocaleString();

  document.getElementById("checkoutForm").addEventListener("submit", function (e) {
    e.preventDefault();

    if (!confirm("Jangan lupa kirim bukti pembayaran ke nomor admin setelah mengirim pesanan. Lanjutkan?")) {
      return;
    }

    const nama = document.getElementById("nama").value;
    const wa = document.getElementById("wa").value;
    const metode = document.getElementById("metode").value;

    const message =
      `*Checkout Pesanan*%0A` +
      `------------------%0A` +
      `Produk: ${produk}%0A` +
      `Harga: Rp${harga.toLocaleString()}%0A` +
      `Metode: ${metode}%0A` +
      `Nama: ${nama}%0A` +
      `WhatsApp: ${wa}%0A` +
      `Pajak (1%): Rp${pajak.toLocaleString()}%0A` +
      `Total: Rp${total.toLocaleString()}`;

    const phoneNumber = "628XXXXXXXXXX"; // Ganti dengan nomor admin Anda
    const waURL = `https://wa.me/${phoneNumber}?text=${message}`;
    window.open(waURL, "_blank");
  });
</script>
</body>
</html>
