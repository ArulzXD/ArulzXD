<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Checkout Produk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f9f9f9;
    }
    .container {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button, .home-button {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      border: none;
      color: white;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover, .home-button:hover {
      background-color: #218838;
    }
    .payment-icons {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 8px;
    }
    .payment-icons img {
      height: 45px;
      background: white;
      border-radius: 8px;
      padding: 4px;
      border: 1px solid #ddd;
    }
    .order-summary {
      margin-top: 20px;
      border-top: 1px solid #ccc;
      padding-top: 10px;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
    }
    .summary-table td {
      padding: 8px 0;
    }
    .total-row td {
      border-top: 2px solid #000;
      font-weight: bold;
    }
    /* Modal untuk galeri */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.8);
    }
    .modal img {
      max-width: 90%;
      margin: 20px auto;
      display: block;
      border-radius: 12px;
    }
    .modal .close {
      position: absolute;
      top: 15px;
      right: 25px;
      color: white;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Checkout Produk</h2>

    <!-- Gambar Produk -->
    <div class="form-group">
      <label>Klik Gambar Untuk Melihat</label>
      <img id="gambar-produk" src="" alt="Klik Gambar Untuk Melihat" style="width: 100%; border-radius: 10px; margin-bottom: 10px; border: 1px solid #ccc; cursor: zoom-in;" />
    </div>

    <!-- Deskripsi Produk -->
    <div class="form-group">
      <label>Deskripsi Produk</label>
      <p id="deskripsi-produk" style="background: #f1f1f1; padding: 10px; border-radius: 6px;"></p>
    </div>

    <form id="checkoutForm">
      <div class="form-group">
        <label for="produk">Produk</label>
        <input type="text" id="produk" name="produk" readonly />
      </div>
      <div class="form-group">
        <label for="harga">Harga</label>
        <input type="text" id="harga" name="harga" readonly />
      </div>
      <div class="form-group">
        <label for="metode">Metode Pembayaran</label>
        <select id="metode" name="metode" required>
          <option value="">Pilih Metode</option>
          <option value="DANA">DANA</option>
          <option value="OVO">OVO</option>
          <option value="GoPay">GoPay</option>
          <option value="QRIS">QRIS</option>
        </select>
        <div class="payment-icons">
          <img src="https://i.imgur.com/jyUJkaa.jpeg" alt="DANA" />
          <img src="https://i.imgur.com/eyKiIrk.jpeg" alt="OVO" />
          <img src="https://i.imgur.com/2bUZpBK.jpeg" alt="GoPay" />
          <img src="https://i.imgur.com/WXDsDdx.jpeg" alt="QRIS" style="height: 40px;" />
        </div>
      </div>
      <div class="form-group">
        <label for="nama">Nama Pembeli</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required />
      </div>
      <div class="form-group">
        <label for="wa">Nomor WhatsApp</label>
        <input type="text" id="wa" name="wa" placeholder="08xxxxxxxxxx" required />
      </div>

      <!-- Ringkasan Harga -->
      <div class="order-summary">
        <table class="summary-table">
          <tr>
            <td>Subtotal</td>
            <td id="subtotal">Rp0</td>
          </tr>
          <tr>
            <td>Pajak (0.5%)</td>
            <td id="pajak">Rp0</td>
          </tr>
          <tr class="total-row">
            <td>Total</td>
            <td id="total">Rp0</td>
          </tr>
        </table>
      </div>

      <button type="submit">Kirim Pesanan via WhatsApp</button>
    </form>
    <a href="index.html"><button class="home-button">Kembali ke Beranda</button></a>
  </div>

  <!-- Modal Gambar Spek -->
  <div id="imageModal" class="modal">
    <span class="close" onclick="document.getElementById('imageModal').style.display='none'">&times;</span>
    <div id="modalGallery"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const produk = params.get("produk") || "Produk Tidak Diketahui";
    const hargaProduk = parseInt(params.get("harga") || "0");
    const deskripsi = params.get("deskripsi") || "Deskripsi tidak tersedia.";
    
    // Ambil gambar spek dari URL: gambar1, gambar2, ..., gambar5
    const spekGambar = [];
    for (let i = 1; i <= 5; i++) {
      const g = params.get("gambar" + i);
      if (g) spekGambar.push(g);
    }

    const gambarUtama = spekGambar[0] || "?text=Gambar+Produk";
    const pajak = Math.round(hargaProduk * 0.005);
    const total = hargaProduk + pajak;

    document.getElementById("produk").value = produk;
    document.getElementById("harga").value = "Rp" + hargaProduk.toLocaleString();
    document.getElementById("subtotal").textContent = "Rp" + hargaProduk.toLocaleString();
    document.getElementById("pajak").textContent = "Rp" + pajak.toLocaleString();
    document.getElementById("total").textContent = "Rp" + total.toLocaleString();
    document.getElementById("deskripsi-produk").textContent = deskripsi;
    document.getElementById("gambar-produk").src = gambarUtama;

    // Event klik gambar untuk buka galeri modal
    document.getElementById("gambar-produk").addEventListener("click", () => {
      const modal = document.getElementById("imageModal");
      const gallery = document.getElementById("modalGallery");

      gallery.innerHTML = spekGambar.map(src => `
        <img src="${src}" alt="Spek Gambar" />
      `).join("");

      modal.style.display = "block";
    });

    // WhatsApp checkout
    document.getElementById("checkoutForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const nama = document.getElementById("nama").value;
      const wa = document.getElementById("wa").value;
      const metode = document.getElementById("metode").value;

      const message =
  `*Checkout Produk*%0A` +
  `==============================%0A` +
  `Produk        : ${produk}%0A` +
  `Jumlah        : 1 pcs%0A` +
  `Harga Satuan  : Rp${hargaProduk.toLocaleString()}%0A` +
  `Subtotal      : Rp${hargaProduk.toLocaleString()}%0A` +
  `Pajak (0.5%)  : Rp${pajak.toLocaleString()}%0A` +
  `Total         : Rp${total.toLocaleString()}%0A` +
  `==============================%0A` +
  `Nama          : ${nama}%0A` +
  `WhatsApp      : ${wa}%0A` +
  `Metode Bayar  : ${metode}%0A` +
  `Transfer ke   : ${getTransferInfo(metode)}`;

function getTransferInfo(metode) {
  switch (metode) {
    case "DANA":
      return "DANA - 081234567890 a.n. Admin";
    case "OVO":
      return "OVO - 081234567890 a.n. Admin";
    case "GoPay":
      return "GoPay - 081234567890 a.n. Admin";
    case "QRIS":
      return "Silakan scan QRIS melalui link berikut:%0Ahttps://link.com/qris";
    default:
      return "-";
  }
}

      const phoneNumber = "6283171080910"; // Nomor admin
      const waURL = `https://wa.me/${phoneNumber}?text=${message}`;

      if (confirm("JANGAN LUPA KIRIM BUKTI PEMBAYARAN KE NOMOR ADMIN\n\nKlik OK untuk Pesan Sekarang")) {
        window.open(waURL, "_blank");
      }
    });
  </script>
</body>
</html>
