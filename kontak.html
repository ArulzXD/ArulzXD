<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credits Proyek</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    padding: 0;
    transition: background-color 0.3s, color 0.3s;
  }
  .container {
    max-width: 800px;
    margin: auto;
    padding: 20px;
  }
  .header {
    text-align: center;
    margin-bottom: 30px;
  }
  .header h1 {
    color: #3366FF;
    margin-bottom: 10px;
  }
  .card {
    background: rgba(255,255,255,0.8);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    transition: background 0.3s;
  }
  .card.dark {
    background: rgba(0,0,0,0.3);
  }
  .card img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
  }
  .card-content {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .card-text h3 {
    margin: 0;
  }
  .toggle-btn {
    position: fixed;
    top: 15px;
    right: 15px;
    background: #3366FF;
    color: white;
    border: none;
    border-radius: 30px;
    padding: 8px 16px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  body.dark-mode {
    background-color: #121212;
    color: white;
  }
</style>
</head>
<body>
<button class="toggle-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
<div class="container">
  <div class="header">
    <h1>Credits Proyek</h1>
    <p>Terima kasih kepada para kontributor hebat kami!</p>
  </div>

  <div class="card">
    <div class="card-content">
      <img src="https://via.placeholder.com/80" alt="Rerezz Official">
      <div class="card-text">
        <h3>Rerezz Official</h3>
        <p>Pengembang Utama</p>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-content">
      <img src="https://via.placeholder.com/80" alt="Website Design">
      <div class="card-text">
        <h3>Website Design</h3>
        <p>Team Pengembang</p>
      </div>
    </div>
  </div>
</div>

<script>
function toggleTheme() {
  document.body.classList.toggle('dark-mode');
  const cards = document.querySelectorAll('.card');
  cards.forEach(card => card.classList.toggle('dark'));

  const btn = document.querySelector('.toggle-btn');
  if(document.body.classList.contains('dark-mode')) {
    btn.textContent = '☀️ Light Mode';
  } else {
    btn.textContent = '🌙 Dark Mode';
  }
}
</script>

</body>
</html>
