<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credits Proyek</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #1a1a1a;
      --card-bg: rgba(255, 255, 255, 0.7);
      --accent-color: #3b82f6;
      --border-radius: 16px;
    }[data-theme='dark'] {
  --bg-color: #121212;
  --text-color: #f0f0f0;
  --card-bg: rgba(30, 30, 30, 0.7);
  --accent-color: #3b82f6;
}

body {
  background: var(--bg-color);
  color: var(--text-color);
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  padding: 0;
  transition: all 0.3s ease;
}

header {
  padding: 1.5rem;
  text-align: center;
}

h1 {
  color: var(--accent-color);
  margin-bottom: 0.5rem;
  font-size: 2rem;
}

p.subtitle {
  margin-top: 0;
  color: var(--text-color);
  opacity: 0.8;
  font-size: 1rem;
}

.theme-toggle {
  position: fixed;
  top: 1rem;
  right: 1rem;
  background: var(--accent-color);
  color: white;
  border: none;
  border-radius: 50%;
  width: 48px;
  height: 48px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  transition: background 0.3s;
}

.theme-toggle:hover {
  background: #2563eb;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 1rem;
}

.card {
  background: var(--card-bg);
  border-radius: var(--border-radius);
  padding: 1rem;
  margin-bottom: 1.5rem;
  box-shadow: 0 6px 12px rgba(0,0,0,0.1);
  display: flex;
  align-items: center;
  backdrop-filter: blur(8px);
  transition: background 0.3s ease;
}

.card img {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  margin-right: 1rem;
  border: 3px solid var(--accent-color);
}

.card h2 {
  margin: 0;
  font-size: 1.4rem;
}

.card p {
  margin: 0.3rem 0 0;
  font-size: 1rem;
  opacity: 0.8;
}

.resources {
  text-align: center;
  margin-top: 2rem;
}

.resources a {
  margin: 0.3rem;
  display: inline-block;
  color: var(--accent-color);
  text-decoration: none;
  font-weight: 500;
}

.resources a:hover {
  text-decoration: underline;
}

  </style>
</head>
<body><button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>

<header>
  <h1>Credits Proyek</h1>
  <p class="subtitle">Terima kasih kepada para kontributor hebat kami!</p>
</header><div class="container">
  <h2>Kontributor</h2>  <div class="card">
    <img src="https://via.placeholder.com/90" alt="Rerezz Official">
    <div>
      <h2>Rerezz Official</h2>
      <p>Pengembang Utama</p>
    </div>
  </div>  <div class="card">
    <img src="https://via.placeholder.com/90" alt="Website Design">
    <div>
      <h2>Website Design</h2>
      <p>Team Pengembang</p>
    </div>
  </div>  <div class="resources">
    <h2>Alat dan Sumber Daya yang Digunakan</h2>
    <a href="#">Standar Web W3C</a>
    <a href="#">MDN Web Docs</a>
    <a href="#">Bootstrap</a>
    <a href="#">FontAwesome</a>
  </div>
</div><script>
  const toggleBtn = document.getElementById('themeToggle');
  const currentTheme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', currentTheme);

  if (currentTheme === 'dark') {
    toggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
  }

  toggleBtn.addEventListener('click', () => {
    const theme = document.documentElement.getAttribute('data-theme');
    if (theme === 'light') {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
      toggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      localStorage.setItem('theme', 'light');
      toggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
    }
  });
</script></body>
</html>
