<!DOCTYPE html>
<html lang="id" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ArulzXD Digital Marketplace</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --card-bg: #ffffff;
      --badge-color: #ef4444;
    }

    [data-theme="dark"] {
      --bg-color: #111827;
      --text-color: #f9fafb;
      --card-bg: #1f2937;
      --badge-color: #dc2626;
    }

    [data-theme="light"] {
      --bg-color: #ffffff;
      --text-color: #000000;
      --card-bg: #ffffff;
      --badge-color: #ef4444;
    }

    [data-theme="system"] {
      color-scheme: light dark;
    }

    body, html {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    header {  
      background-color: red; /* Ubah dari background-image menjadi warna merah */
      color: white;  
      padding: 15px 20px;  
      text-align: center;  
      border-radius: 20px;  
      font-size: 25px;  
    }

    .theme-toggle {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 8px;
    }

    .theme-toggle button {
      padding: 6px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: rgba(255,255,255,0.8);
    }

    .menu {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px auto;
      padding: 10px 15px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      backdrop-filter: blur(8px);
    }

    .menu-item {
      padding: 10px 20px;
      background-color: #f1f5f9;
      color: #1f2937;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease-in-out;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .menu-item:hover {
      background-color: #dbeafe;
      color: #1d4ed8;
      transform: translateY(-2px);
    }

    .menu-item.active {
      background-color: #000;
      color: #fff;
    }

    .led-scroller {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      box-sizing: border-box;
      padding: 10px 0;
      color: #0f0;
      background-color: black;
      font-weight: bold;
      font-size: 25px;
      text-shadow: 0 0 5px #0f0, 0 0 10px #0f0;
      margin-top: 15px;
      text-align: center;
      position: relative;
      border: 4px solid transparent;
      border-radius: 5px;
      background-clip: padding-box;
      box-shadow: 0 0 10px #0f0, 0 0 20px #0f0;
      animation: outline-glow 1.5s infinite alternate;
    }

    @keyframes outline-glow {
      0% {
        box-shadow: 0 0 5px #0f0, 0 0 10px #0f0, inset 0 0 5px #0f0;
      }
      50% {
        box-shadow: 0 0 15px #0f0, 0 0 30px #0f0, inset 0 0 10px #0f0;
      }
      100% {
        box-shadow: 0 0 5px #0f0, 0 0 10px #0f0, inset 0 0 5px #0f0;
      }
    }

    .led-scroller::before {
      content: '';
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      border-radius: 8px;
      padding: 2px;
      background: linear-gradient(90deg, #0f0, #00f, #0f0, #0ff, #0f0);
      background-size: 300% 300%;
      animation: borderRun 4s linear infinite;
      z-index: -1;
      mask-image: linear-gradient(#fff 0 0);
      -webkit-mask-image: linear-gradient(#fff 0 0);
    }

    @keyframes borderRun {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .testimonial-section {
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .testimonial-card {
      background: var(--card-bg);
      color: var(--text-color);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 90%;
      width: 500px;
      overflow: hidden;
      transition: transform 0.3s ease;
      text-align: left;
    }

    .testimonial-card:hover {
      transform: translateY(-6px);
    }

    .testimonial-card img {
      width: 100%;
      height: auto;
      border-bottom: 1px solid #ddd;
    }

    .testimonial-content {
      padding: 25px;
    }

    .testimonial-content h2 {
      font-size: 24px;
      margin-bottom: 12px;
    }

    .testimonial-content p {
      font-size: 16px;
    }

    .badge {
      display: inline-block;
      margin-top: 15px;
      padding: 6px 12px;
      background-color: var(--badge-color);
      color: white;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <header>
    <h1>TESTIMONI</h1>
    <div class="theme-toggle">
      <button onclick="setTheme('light')">☀️</button>
      <button onclick="setTheme('dark')">🌙</button>
      <button onclick="setTheme('system')">🖥️</button>
    </div>
  </header>

  <div class="led-scroller">
    <span id="ledScrollText">🎁 Promo Spesial Hari Ini!</span>
  </div>

  <div class="menu">
    <a href="index.html" class="menu-item">All</a>
    <a href="testi.html" class="menu-item">Testimoni</a>
    <a href="sosmed.html" class="menu-item">Sosmed</a>
    <a href="kontak.html" class="menu-item">Credits</a>
  </div>

  <div class="testimonial-section">
    <div class="testimonial-card">
      <img src="https://files.catbox.moe/g7m44v.png" alt="Testimoni Akun Terjual">
      <div class="testimonial-content">
        <h2>AKUN COC 39K TERJUAL</h2>
        <p>Pelanggan puas dan akun telah berhasil dijual dengan aman dan cepat melalui layanan kami.</p>
        <span class="badge">SOLD</span>
      </div>
    </div>
  </div>

  <script>
    const ledMessages = [
      "🎁 Promo Spesial Hari Ini!",
      "⚡ Diskon 30% untuk semua layanan!",
      "✅ Garansi layanan bot 1 bulan!",
      "✉️ Hubungi kami untuk custom script!",
      "⏰ Support 24 jam nonstop!",
      "♻️ Gratis update script bot selama 3 bulan!"
    ];
    let current = 0;
    const text = document.getElementById("ledScrollText");

    function updateScroll() {
      text.textContent = ledMessages[current];
      current = (current + 1) % ledMessages.length;
    }

    setInterval(updateScroll, 4000);

    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("theme", theme);
    }

    (function applySavedTheme() {
      const saved = localStorage.getItem("theme") || "system";
      setTheme(saved);
    })();

    // Aktifkan menu berdasarkan halaman
    document.querySelectorAll('.menu-item').forEach(link => {
      const page = window.location.pathname.split("/").pop();
      const href = link.getAttribute("href");
      if (href === page || (page === "" && href === "index.html")) {
        link.classList.add("active");
      } else {
        link.classList.remove("active");
      }
    });
  </script>
</body>
</html>
