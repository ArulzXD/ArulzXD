<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ArulzXD Digital Marketplace - Testimoni</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #1f2937;
      --card-bg: rgba(255, 255, 255, 0.85);
      --badge-bg: #dc2626;
    }

    [data-theme="dark"] {
      --bg-color: #1a1a1a;
      --text-color: #f1f1f1;
      --card-bg: rgba(30, 30, 30, 0.9);
      --badge-bg: #f87171;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background 0.3s, color 0.3s;
    }

    header {
      background-image: url('https://files.catbox.moe/i8aq5n.jpg');
      background-size: cover;
      background-position: center;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      border-radius: 20px;
      position: relative;
    }

    .theme-toggle {
      position: absolute;
      top: 10px;
      right: 10px;
    }

    .theme-toggle select {
      padding: 6px 10px;
      border-radius: 8px;
      border: none;
      background-color: #f1f1f1;
      font-weight: bold;
    }

    .menu {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px auto;
      padding: 10px 15px;
    }

    .menu-item {
      padding: 10px 20px;
      background-color: #f1f5f9;
      color: #1f2937;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease-in-out;
    }

    .menu-item:hover {
      background-color: #dbeafe;
      color: #1d4ed8;
      transform: translateY(-2px);
    }

    .menu-item.active {
      background-color: #000;
      color: #fff;
      font-weight: bold;
    }

    .led-scroller {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      box-sizing: border-box;
      padding: 10px 0;
      color: #0f0;
      background-color: black;
      font-weight: bold;
      font-size: 25px;
      text-align: center;
      border-radius: 5px;
      margin-top: 15px;
    }

    .testimonial-section {
      display: flex;
      justify-content: center;
      padding: 30px 20px;
    }

    .testimonial-card {
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      width: 90%;
      max-width: 600px;
      overflow: hidden;
      transition: transform 0.3s ease;
      text-align: left;
    }

    .testimonial-card:hover {
      transform: translateY(-5px);
    }

    .testimonial-card img {
      width: 100%;
      height: auto;
      border-bottom: 1px solid #ddd;
    }

    .testimonial-content {
      padding: 25px;
    }

    .testimonial-content h2 {
      font-size: 22px;
      margin-bottom: 12px;
    }

    .testimonial-content p {
      font-size: 16px;
    }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 12px;
      background-color: var(--badge-bg);
      color: white;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <header>
    <h1>TESTIMONI</h1>
    <div class="theme-toggle">
      <select id="themeSwitcher">
        <option value="system">System</option>
        <option value="light">Terang</option>
        <option value="dark">Gelap</option>
      </select>
    </div>
  </header>

  <div class="led-scroller">
    <span id="ledScrollText">🎁 Promo Spesial Hari Ini!</span>
  </div>

  <div class="menu">
    <a href="index.html" class="menu-item">All</a>
    <a href="testi.html" class="menu-item active">Testimoni</a>
    <a href="sosmed.html" class="menu-item">Sosmed</a>
    <a href="kontak.html" class="menu-item">Credits</a>
  </div>

  <div class="testimonial-section">
    <div class="testimonial-card">
      <img src="https://files.catbox.moe/g7m44v.png" alt="Testimoni Akun Terjual" />
      <div class="testimonial-content">
        <h2>AKUN COC 39K TERJUAL</h2>
        <p>Pelanggan puas dan akun telah berhasil dijual dengan aman dan cepat melalui layanan kami.</p>
        <span class="badge">SOLD</span>
      </div>
    </div>
  </div>

  <script>
    const themeSwitcher = document.getElementById("themeSwitcher");

    function applyTheme(theme) {
      if (theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      } else if (theme === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      } else {
        // System
        const isDarkMode = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", isDarkMode ? "dark" : "light");
      }
    }

    themeSwitcher.addEventListener("change", (e) => {
      const selectedTheme = e.target.value;
      localStorage.setItem("theme", selectedTheme);
      applyTheme(selectedTheme);
    });

    // Apply saved or system theme on load
    const savedTheme = localStorage.getItem("theme") || "system";
    themeSwitcher.value = savedTheme;
    applyTheme(savedTheme);

    // Auto update system theme
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      const saved = localStorage.getItem("theme");
      if (saved === "system") applyTheme("system");
    });
  </script>
</body>
</html>
