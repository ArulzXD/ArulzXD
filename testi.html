<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ArulzXD Digital Marketplace</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: rgba(255, 255, 255, 0.5);
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        .video-background {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            transform: translate(-50%, -50%);
        }
        header {
            background-image: url('https://i.imgur.com/4qHH3ZU.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
            padding: 15px 20px; 
            text-align: center;
            border-radius: 20px;
            font-size: 25px;
        }
        .text {
            display: flex;
            background-color: rgba(255, 255, 255, 0.7);
            background-size: cover;
            background-position: center;
            background-repeat: repeat;
            border-radius: 150px;
            padding: 5px;
            text-align: center;
            align-items: center;
            color: black;
            font-size: 16px;
        }
        .container {
            text-align: center;
            margin: 20px;
        }
        img {
            max-width: 100%; /* Agar gambar responsif */
            height: auto;
            }
        .menu {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px auto;
    padding: 10px 15px;
    background-color: rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    backdrop-filter: blur(8px);
}

.menu-item {
    padding: 10px 20px;
    background-color: #f1f5f9;
    color: #1f2937;
    border-radius: 10px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s ease-in-out;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

.menu-item:hover {
    background-color: #dbeafe;
    color: #1d4ed8;
    transform: translateY(-2px);
}

.menu-item.active {
    background-color: #000;
    color: #fff;
    font-weight: bold;
}
    </style>
</head>
<body>
    <video autoplay muted loop class="video-background">
        <source src="https://files.catbox.moe/bexgq8.mp4" type="video/mp4">
        ArulzXD Digital Marketplace
    </video>

    <br>
    <header>
        <h1 class="typing-effect">TESTIMONI</h1>
    </header>
    <br>

    <div class="menu">
        <a href="index.html" class="menu-item">All</a>
        <a href="testi.html" class="menu-item">Testimoni</a>
        <a href="scbot.html" class="menu-item">Script</a>
        <a href="kontak.html" class="menu-item">Credits</a>
    </div>
    
    <div class="container">
        <img src="https://pomf2.lain.la/f/fbokpeaf.jpg" alt="Deskripsi Gambar">
        <h1 class="text">SOLD AKUN ML 6K</h1>
    </div>
    <div class="container">
        <img src="https://pomf2.lain.la/f/fbokpeaf.jpg" alt="Deskripsi Gambar">
        <h1 class="text">PANEL UNLI</h1>
    </div>
<script>
// Highlight menu aktif berdasarkan URL
document.querySelectorAll('.menu-item').forEach(link => {
    const page = window.location.pathname.split("/").pop();
    const href = link.getAttribute("href");

    if (href === page || (page === "" && href === "index.html")) {
        link.classList.add("active");
    } else {
        link.classList.remove("active");
    }
});
</script>
</body>
    </html>
