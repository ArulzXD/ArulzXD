<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toko Digital Rerez Official</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: rgba(255, 255, 255, 0.5);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .video-background {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: -1;
      transform: translate(-50%, -50%);
    }

    header {
      background-image: url('https://pomf2.lain.la/f/fbokpeaf.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      padding: 15px 20px;
      text-align: center;
      border-radius: 20px;
      font-size: 25px;
    }

    .menu {
      display: flex;
      background-image: url('https://pomf2.lain.la/f/fbokpeaf.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 20px;
      padding: 5px;
      text-align: center;
      align-items: center;
      justify-content: center;
    }

    .menu-item {
      padding: 10px 20px;
      margin: 0 5px;
      color: white;
      text-decoration: none;
      transition: background-color 0.5s;
    }

    .menu-item:hover {
      background-color: #555;
    }

    .content {
      padding: 20px;
      color: white;
    }

    .product-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .product-card {
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      width: 200px;
      text-align: center;
      padding: 15px;
    }

    .product-card img {
      width: 100%;
      height: auto;
      border-radius: 5px;
    }

    .product-card h3 {
      margin: 10px 0;
      font-size: 18px;
      color: #333;
    }

    .product-card .button {
      margin-top: 10px;
      padding: 8px 15px;
      background-color: #28a745;
      color: wheat;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .product-card .button:hover {
      background-color: #218838;
    }

    @media (max-width: 600px) {
      .product-card {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <video autoplay muted loop class="video-background">

</html>
