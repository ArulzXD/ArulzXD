<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toko Digital Rerez Official</title>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
    }
    .video-background {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: -1;
      transform: translate(-50%, -50%);
    }
    header {
      background-image: url('https://pomf2.lain.la/f/fbokpeaf.jpg');
      background-size: cover;
      background-position: center;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      border-radius: 15px;
      margin: 20px;
    }
    .menu {
      display: flex;
      justify-content: center;
      background-image: url('https://pomf2.lain.la/f/fbokpeaf.jpg');
      background-size: cover;
      padding: 10px;
      border-radius: 15px;
      margin: 0 20px;
    }
    .menu-item {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
      transition: opacity 0.3s;
    }
    .menu-item:hover {
      opacity: 0.8;
    }
    .product-wrapper {
      max-width: 1100px;
      margin: 40px auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .item-product {
      width: 220px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s;
    }
    .item-product:hover {
      transform: translateY(-5px);
    }
    .item-product img {
      width: 100%;
      height: auto;
    }
    .card-body {
      padding: 10px;
      text-align: center;
    }
    .card-text {
      font-weight: bold;
      min-height: 48px;
    }
    .newPrice {
      color: #28a745;
      font-weight: bold;
    }
    .oldPrice {
      color: #888;
      font-size: 14px;
      text-decoration: line-through;
    }
    .stars-rating i {
      color: gold;
    }
    .lihat-button {
      margin-top: 10px;
      padding: 8px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 5px;
      width: 100%;
      cursor: pointer;
    }
    .lihat-button:hover {
      background: #333;
    }
  </style>
</head>
<body>
  <video autoplay muted loop class="video-background">
    <source src="https://pomf2.lain.la/f/x4piwqwe.mp4" type="video/mp4">
  </video>

  <header>DAFTAR PRODUK</header>

  <div class="menu">
    <a href="index.html" class="menu-item">Beranda</a>
    <a href="produk.html" class="menu-item">Layanan</a>
    <a href="testi.html" class="menu-item">Testimoni</a>
    <a href="scbot.html" class="menu-item">SC BOT</a>
    <a href="kontak.html" class="menu-item">Kontak</a>
  </div>

  <div class="product-wrapper">
    <a href="produk.html" class="item-product">
      <img src="https://via.placeholder.com/300x200" alt="Produk 1" />
      <div class="card-body">
        <p class="card-text">SC BOT AUTOORDER V1.3.0</p>
        <p class="newPrice">Rp. 60.000</p>
        <div class="stars-rating">
          <i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i>
        </div>
        <button class="lihat-button">Lihat Produk</button>
      </div>
    </a>

    <a href="produk.html" class="item-product">
      <img src="https://via.placeholder.com/300x200" alt="Produk 2" />
      <div class="card-body">
        <p class="card-text">JASA INSTALL PANEL</p>
        <p class="newPrice">Rp. 10.000</p>
        <div class="stars-rating">
          <i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i>
        </div>
        <button class="lihat-button">Lihat Produk</button>
      </div>
    </a>

    <a href="produk.html" class="item-product">
      <img src="https://via.placeholder.com/300x200" alt="Produk 3" />
      <div class="card-body">
        <p class="card-text">SCRIPT WEBSITE STORE</p>
        <p class="oldPrice">Rp. 300.000</p>
        <p class="newPrice">Rp. 201.000</p>
        <div class="stars-rating">
          <i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i>
        </div>
        <button class="lihat-button">Lihat Produk</button>
      </div>
    </a>

    <a href="produk.html" class="item-product">
      <img src="https://via.placeholder.com/300x200" alt="Produk 4" />
      <div class="card-body">
        <p class="card-text">SCRIPT BOT AUTO ORDER</p>
        <p class="oldPrice">Rp. 40.000</p>
        <p class="newPrice">Rp. 30.000</p>
        <div class="stars-rating">
          <i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i>
        </div>
        <button class="lihat-button">Lihat Produk</button>
      </div>
    </a>
  </div>
</body>
</html>
