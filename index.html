<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Toko Digital Rerez Official</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: rgba(255, 255, 255, 0.5);
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        .video-background {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            transform: translate(-50%, -50%);
        }
        header {
            background-image: url('https://pomf2.lain.la/f/fbokpeaf.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
            padding: 15px 20px; 
            text-align: center;
            border-radius: 20px;
            font-size: 25px;
        }
        .menu {
            display: flex;
            background-image: url('https://pomf2.lain.la/f/fbokpeaf.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 20px;
            padding: 5px;
            text-align: center;
            align-items: center;
            justify-content: center;
        }
        .menu-item {
            padding: 10px 20px;
            margin: 0 5px;
            color: white;
            text-decoration: none;
            transition: background-color 0.5s;
        }
        .menu-item:hover {
            background-color: #555;
        }
        .content {
            padding: 20px;
            color: white;
        }
        .product-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .item-product {
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
            background-color: white;
            color: black;
        }
        .card-img-top {
            width: 100%;
            height: auto;
        }
        .card-body {
            padding: 10px;
            text-align: center;
        }
        .newPrice {
            font-weight: bold;
            color: #28a745;
        }
        .stars-rating {
            color: gold;
            margin-bottom: 10px;
        }
        .button {
            margin-top: 10px;
            padding: 8px 15px;
            background-color: #28a745;
            color: wheat;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <video autoplay muted loop class="video-background">
        <source src="https://pomf2.lain.la/f/x4piwqwe.mp4" type="video/mp4">
        TOKO DIGITAL REREZZ OFFICIAL
    </video>

    <br><header>
        <h1>DAFTAR PRODUK</h1>
    </header><br>

    <div class="menu">
        <a href="index.html" class="menu-item">Beranda</a>
        <a href="produk.html" class="menu-item">Layanan</a>
        <a href="testi.html" class="menu-item">Testimoni</a>
        <a href="scbot.html" class="menu-item">SC BOT</a>
        <a href="kontak.html" class="menu-item">Kontak</a>
    </div>

    <div class="content">
      <div class="product-wrapper">
        
        <!-- Produk 1 -->
        <div class="item-product">
          <img src="https://telegra.ph/file/c2bd71b704393fc69788c.jpg" class="card-img-top" alt="Produk 1">
          <div class="card-body">
            <p class="card-text">Produk 1</p>
            <p class="newPrice">Rp. 50.000</p>
            <div class="stars-rating">
              <i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i>
            </div>
            <button class="button" onclick="location.href='produk.html'">Lihat Produk</button>
          </div>
        </div>

        <!-- Produk 2 -->
        <div class="item-product">
          <img src="https://via.placeholder.com/150" class="card-img-top" alt="Produk 2">
          <div class="card-body">
            <p class="card-text">Produk 2</p>
            <p class="newPrice">Rp. 40.000</p>
            <div class="stars-rating">
              <i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i>
            </div>
            <button class="button" onclick="location.href='produk.html'">Lihat Produk</button>
          </div>
        </div>

        <!-- Produk 3 -->
        <div class="item-product">
          <img src="https://via.placeholder.com/150" class="card-img-top" alt="Produk 3">
          <div class="card-body">
            <p class="card-text">Produk 3</p>
            <p class="newPrice">Rp. 30.000</p>
            <div class="stars-rating">
              <i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i>
            </div>
            <button class="button" onclick="location.href='produk.html'">Lihat Produk</button>
          </div>
        </div>

        <!-- Tambahkan produk tambahan sesuai kebutuhan -->

      </div>
    </div>
</body>
</html>
